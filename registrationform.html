<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registrationform</title>
    <style>
        *, html {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    #box {
    width: 600px;
    min-height: 900px;
    background-color: #acc98b;
    margin: 25px auto;
    padding: 30px 40px;
    box-shadow: 10px 10px 15px #89ce83;
    }

    form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    }

    form > div {
    display: flex;
    align-items: center;
    }

    label {
    width: 170px;
    font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="password"],
    textarea,
    select {
    width: 300px;
    padding: 8px;
    border: 1px solid #777;
    border-radius: 4px;
    }

    textarea {
    height: 80px;
    resize: none;   
    }

    input[type="radio"] {
    margin-left: 10px;
    margin-right: 5px;
    }

    input[type="submit"],
    input[type="reset"] {
    padding: 8px 20px;
    margin-right: 10px;
    cursor: pointer;
    }
    </style>
</head>
<body>
    <div id="box">
        <form>
            <div>
                <label>Your Name:</label>
                <input type="text" placeholder="Enter your name">
            </div>
            <div>
                <label>Your Email:</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div>
                <label>Your Phone Number:</label>
                <input type="text" placeholder="Enter your phone number">
            </div>
            <div>
                <label>Your Date of Birth:</label>
                <input type="date" placeholder="Enter your date of birth">
            </div>
            <div>
                <label>Your Gender:</label>
                <input type="radio" name="gender" value="male">Male
                <input type="radio" name="gender" value="female">Female
            </div>
            <div>
                <label>Your Address:</label>
                <textarea placeholder="Enter your address"></textarea>
            </div>
            <div>   
                <label>Your password:</label>
                <input tooltip="Password must be at least 8 characters long" type="password" placeholder="Enter your password">
            </div>
            <div>
                <label>Your Course:</label>
                <select>
                    <option>Computer Science</option>
                    <option>Mathematics</option>
                    <option>Physics</option>
                </select>
            </div>
            <div>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>
</body>
</html>
