<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <h1>Login</h1>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="password">Password:</label>
        <input
        title="Password must be at least 8 characters long" minlength="4" maxlength="8" 
        tooltip="Password must be at least 8 characters long" type="password" id="password" name="password" required>
        <br><br>

        <buttontype="submit"><a href="https://www.youtube.com/" target="_blank">LOGIN</a></button>

    <p>Forgot your password?</p>
    <p>Don't have an account? <a href="registrationform.html">Register</a></p>
</body>
</html>
