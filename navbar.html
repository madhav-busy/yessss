<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *, html{
            margin: 0;
            padding: 0;
        }
        body{
            font-family: Arial, sans-serif;
            background-color: #e2dea5;
        }
        ul{
            margin: 20px;
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
            background-color: #cbfa7e;
            padding: 10px 10px;
            font-size: 18px;
            text-decoration: none;
        }
        ul li{
            margin: 0;
            gap: 20px;
        }
        ul li a{
            color: #3a1f1f;
            padding: 5px 6px;
            font-family: Arial, sans-serif;
            transition: 0.5s
            text-decoration: none;
            gap: 20px;
        }
        ul li a:hover{
            color: #7599bb;
            border-radius: 2px;
            text-decoration: none;
            font-size: 20px;
        }
        #button{
            background-color: #eea2a2;
            border-radius: 2px;
            padding: 5px 8px;
        }
        #button a{
            color: #3a1f1f;
            text-decoration: none;
        }
        #button a:hover{
            color: #fcf3f3;
            text-decoration: none;
        }

        </style>
</head>
